<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBus Ops Intelligence</title>
    <meta name="description" content="FreshBus internal call center analytics and campaign intelligence platform.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     VIEW 1: LOGIN
═══════════════════════════════════════════════════════ -->
<div id="loginView" class="view-screen active">
    <div class="login-bg-orb orb-1"></div>
    <div class="login-bg-orb orb-2"></div>
    <div class="login-bg-orb orb-3"></div>

    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo">
                <i data-lucide="bus-front"></i>
            </div>
            <div>
                <h1 class="login-title">FreshBus</h1>
                <p class="login-subtitle">Ops Intelligence Platform</p>
            </div>
        </div>

        <form id="loginForm" class="login-form">
            <div class="login-field">
                <label for="loginUsername">Username</label>
                <div class="login-input-wrap">
                    <i data-lucide="user" class="login-input-icon"></i>
                    <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username">
                </div>
            </div>
            <div class="login-field">
                <label for="loginPassword">Password</label>
                <div class="login-input-wrap">
                    <i data-lucide="lock" class="login-input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" id="togglePassword" class="login-eye-btn">
                        <i data-lucide="eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div id="loginError" class="login-error" style="display:none">
                <i data-lucide="alert-circle"></i>
                <span>Invalid username or password.</span>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <i data-lucide="arrow-right" id="loginBtnIcon"></i>
            </button>
        </form>

        <p class="login-footer">FreshBus Internal Use Only &bull; Confidential</p>
    </div>
</div>


<script>
    // Initialize Icons
    lucide.createIcons();
</script>
<script src="/script.js"></script>
</body>
</html>
